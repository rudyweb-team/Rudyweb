<!doctype html>
<html>

<head>
    <title>RUDYweb |Sign up</title>

    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            color: #333;
        }

        input {
            display: block;
            margin: 10px auto;
            padding: 10px;
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        main {
            width: calc(100% - 240px);
            max-width: 680px;
            margin: 100px auto;
        }

        p {
            font-size: 18px;
            line-height: 28px;
        }

        * {
            scroll-behavior: smooth;
        }


        #menuToggle {
            display: block;
            position: fixed;
            top: 50px;
            left: 50px;

            z-index: 1;

            -webkit-user-select: none;
            user-select: none;
        }

        #menuToggle a {
            text-decoration: none;
            color: #232323;

            transition: color 0.3s ease;
        }

        #menuToggle a:hover {
            color: tomato;
        }


        #menuToggle input {
            display: block;
            width: 40px;
            height: 32px;
            position: absolute;
            top: -7px;
            left: -5px;

            cursor: pointer;

            opacity: 0;
            z-index: 2;

            -webkit-touch-callout: none;
        }


        #menuToggle span {
            display: block;
            width: 33px;
            height: 4px;
            margin-bottom: 5px;
            position: relative;

            background: #cdcdcd;
            border-radius: 3px;

            z-index: 1;

            transform-origin: 4px 0px;

            transition: transform 0.5s cubic-bezier(0.77, 0.2, 0.05, 1.0),
                background 0.5s cubic-bezier(0.77, 0.2, 0.05, 1.0),
                opacity 0.55s ease;
        }

        #menuToggle span:first-child {
            transform-origin: 0% 0%;
        }

        #menuToggle span:nth-last-child(2) {
            transform-origin: 0% 100%;
        }

        #menuToggle input:checked~span {
            opacity: 1;
            transform: rotate(45deg) translate(-2px, -1px);
            background: #232323;
        }


        #menuToggle input:checked~span:nth-last-child(3) {
            opacity: 0;
            transform: rotate(0deg) scale(0.2, 0.2);
        }


        #menuToggle input:checked~span:nth-last-child(2) {
            transform: rotate(-45deg) translate(0, -1px);
        }


        #menu {
            position: absolute;
            max-width: 400px;
            width: 100vw;
            max-height: 100vh;
            margin: -100px 0 0 -50px;
            padding: 50px;
            padding-top: 125px;
            box-sizing: border-box;
            overflow-y: auto;
            background: #ededed;
            list-style-type: none;
            -webkit-font-smoothing: antialiased;

            transform-origin: 0% 0%;
            transform: translate(-100%, 0);

            transition: transform 0.5s cubic-bezier(0.77, 0.2, 0.05, 1.0);
        }

        #menu li {
            padding: 10px 0;
            font-size: 22px;
        }

        #menu li label {
            cursor: pointer;
        }


        #menuToggle input:checked~ul {
            transform: none;
        }
    </style>
</head>

<body>

    <h1>Welcome to RUDYweb!</h1>

    <nav role="navigation">
        <div id="menuToggle">

            <input type="checkbox" id="menuCheckbox" />

            <span></span>
            <span></span>
            <span></span>

            <ul id="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="games.html">Games</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="contact.html">Report</a></li>
                <li><a href="dashboard.html">Profile</a></li>
            </ul>

        </div>
    </nav>

    <input type="email" placeholder="Email" id="email" name="email">

    <input type="password" placeholder="Password" id="password" name="password">

    <button type="button" id="submit" onclick="signup()">Sign up</button>

    <a href="lmu.html">
        <h3>Orrrr login</h3>
    </a>

    <script src="./src/scripts/sign.js" type="module"></script>

</body>

</html>
